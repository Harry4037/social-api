services:
  mysql:
    image: mysql:8.0
    container_name: fitconnect-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - fitconnect-network


  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: fitconnect-app
    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - app_uploads:/app/uploads
      - app_logs:/app/logs

    networks:
      - fitconnect-network


volumes:
  mysql_data:
  app_uploads:
  app_logs:


networks:
  fitconnect-network:
    driver: bridge