services:
  mysql:
    image: mysql:8.0
    container_name: seshlly-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - seshlly_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - seshlly-network


  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: seshlly-app
    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - seshlly_app_uploads:/app/uploads
      - seshlly_app_logs:/app/logs

    networks:
      - seshlly-network

  adminer:
    image: adminer:latest
    container_name: seshlly-adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - seshlly-network

volumes:
  seshlly_mysql_data:
  seshlly_app_uploads:
  seshlly_app_logs:


networks:
  seshlly-network:
    driver: bridge